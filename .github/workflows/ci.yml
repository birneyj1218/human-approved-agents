name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Voice extras (faster-whisper, piper) are deliberately not installed.
      - run: pip install -e '.[dev,discord]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest --cov=human_approved_agents --cov-report=term-missing
      - run: python -m human_approved_agents.demo

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: docker compose config -q
