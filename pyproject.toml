[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-approved-agents"
version = "0.1.0"
description = "A small multi-agent system where agents do the work and a human approves anything outbound."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elwood (Jim) Birney" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
# Voice is optional and heavy (CTranslate2 / ONNX runtimes). Not installed for tests.
voice = ["faster-whisper>=1.0", "piper-tts>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
haa = "human_approved_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human_approved_agents = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["human_approved_agents"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["discord", "discord.*", "faster_whisper", "piper", "piper.*", "ctranslate2"]
ignore_missing_imports = true
